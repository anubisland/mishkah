<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e22"/>
      <stop offset="50%" stop-color="#021c14"/>
      <stop offset="100%" stop-color="#01120c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cardGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGradRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGradSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="620" rx="24" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="936" height="596" rx="18" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="18" y="18" width="924" height="584" rx="14" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.4"/>

  <!-- Header Banner -->
  <g text-anchor="middle">
    <text x="480" y="48" font-family="'Cairo', Arial, sans-serif" font-size="22" font-weight="900" fill="url(#goldGrad)">
      ۞ مَنْظُومَةُ أَحْكَامِ الْوَقْفِ وَالاِبْتِدَاءِ وَالسَّكَتَاتِ الأَرْبَعِ لِحَفْصٍ ۞
    </text>
    <text x="480" y="74" font-family="'Cairo', Arial, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">
      كِتَابُ التَّجْوِيدِ الْمُصَوَّرِ — الدُّكْتُورُ أَيْمَنُ رُشْدِي سُوَيْد (المجلد الثاني، ص 579–610)
    </text>
  </g>

  <line x1="40" y1="88" x2="920" y2="88" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Col 1: الوقف الجائز (التام والكافي والحسن) -->
  <g transform="translate(40, 102)" filter="url(#shadow)">
    <rect width="280" height="380" rx="18" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="2"/>
    <rect width="280" height="48" rx="18" fill="#047857"/>
    <rect y="32" width="280" height="16" fill="#047857"/>
    <text x="140" y="32" font-family="'Cairo', Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
      1. أَقْسَامُ الْوَقْفِ الْجَائِزِ
    </text>
    <text x="260" y="74" font-family="'Cairo', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fef08a" text-anchor="end">أنواع الوقف الاختياري الثلاثة الجائزة:</text>

    <g transform="translate(14, 90)">
      <rect width="252" height="82" rx="10" fill="#022c22" stroke="#34d399" stroke-width="1"/>
      <text x="238" y="22" font-family="'Cairo', Arial, sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="end">1. الْوَقْفُ التَّامُّ (قلى / مـ):</text>
      <text x="238" y="42" font-family="'Cairo', Arial, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="end">لا تعلق له بما بعده لفظاً ولا معنى</text>
      <text x="238" y="66" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">﴿وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ﴾</text>
    </g>

    <g transform="translate(14, 182)">
      <rect width="252" height="82" rx="10" fill="#022c22" stroke="#34d399" stroke-width="1"/>
      <text x="238" y="22" font-family="'Cairo', Arial, sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="end">2. الْوَقْفُ الْكَافِي (ج / صلى):</text>
      <text x="238" y="42" font-family="'Cairo', Arial, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="end">تعلق بما بعده معنىً لا لفظاً (إعراباً)</text>
      <text x="238" y="66" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">﴿إِنَّ ٱلَّذِينَ كَفَرُوا۟ سَوَآءٌ عَلَيْهِمْ﴾</text>
    </g>

    <g transform="translate(14, 274)">
      <rect width="252" height="92" rx="10" fill="#022c22" stroke="#34d399" stroke-width="1"/>
      <text x="238" y="22" font-family="'Cairo', Arial, sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="end">3. الْوَقْفُ الْحَسَنُ:</text>
      <text x="238" y="40" font-family="'Cairo', Arial, sans-serif" font-size="10.5" fill="#ecfdf5" text-anchor="end">يحسن الوقف عليه ولا يُبتدأ بما بعده</text>
      <text x="238" y="58" font-family="'Cairo', Arial, sans-serif" font-size="10.5" fill="#fef3c7" text-anchor="end">إلا إذا كان رأس آية مسنونة:</text>
      <text x="238" y="80" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">﴿ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ﴾</text>
    </g>
  </g>

  <!-- Col 2: الوقف القبيح المحرم -->
  <g transform="translate(340, 102)" filter="url(#shadow)">
    <rect width="280" height="380" rx="18" fill="url(#cardGradRed)" stroke="#f43f5e" stroke-width="2"/>
    <rect width="280" height="48" rx="18" fill="#9f1239"/>
    <rect y="32" width="280" height="16" fill="#9f1239"/>
    <text x="140" y="32" font-family="'Cairo', Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
      2. الْوَقْفُ الْقَبِيحُ (الْمَمْنُوعُ)
    </text>
    <text x="260" y="74" font-family="'Cairo', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fecdd3" text-anchor="end">وقف يفسد المعنى أو يوهم فساد العقيدة:</text>
    <text x="260" y="96" font-family="'Cairo', Arial, sans-serif" font-size="11" fill="#ffe4e6" text-anchor="end">• حكمه: لا يجوز تعمده إطلاقاً</text>
    <text x="260" y="118" font-family="'Cairo', Arial, sans-serif" font-size="11" fill="#ffe4e6" text-anchor="end">• إن وقف لضيق نفس أعاد ما قبله</text>

    <g transform="translate(14, 134)">
      <rect width="252" height="228" rx="10" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
      <text x="238" y="24" font-family="'Cairo', Arial, sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="end">أمثلة الوقف القبيح الشنيع:</text>
      
      <text x="238" y="52" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">﴿إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦ﴾ (قبيح)</text>
      <text x="238" y="74" font-family="'Cairo', Arial, sans-serif" font-size="10.5" fill="#fca5a5" text-anchor="end">الصواب: ﴿أَن يَضْرِبَ مَثَلًا﴾</text>
      
      <text x="238" y="104" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">﴿فَوَيْلٌ لِّلْمُصَلِّينَ﴾ (قبيح)</text>
      <text x="238" y="126" font-family="'Cairo', Arial, sans-serif" font-size="10.5" fill="#fca5a5" text-anchor="end">الصواب: إتمام ﴿ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ﴾</text>

      <text x="238" y="156" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">﴿إِنَّمَا يَسْتَجِيبُ ٱلَّذِينَ يَسْمَعُونَۘ﴾</text>
      <text x="238" y="178" font-family="'Cairo', Arial, sans-serif" font-size="10.5" fill="#fca5a5" text-anchor="end">علامة الوقف اللازم (مـ): لئلا يوصل بالموتى</text>
      
      <text x="238" y="206" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">﴿وَٱلْمَوْتَىٰ يَبْعَثُهُمُ ٱللَّهُ﴾</text>
    </g>
  </g>

  <!-- Col 3: سكتات حفص الأربع -->
  <g transform="translate(640, 102)" filter="url(#shadow)">
    <rect width="280" height="380" rx="18" fill="url(#cardGradSky)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="280" height="48" rx="18" fill="#0284c7"/>
    <rect y="32" width="280" height="16" fill="#0284c7"/>
    <text x="140" y="32" font-family="'Cairo', Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">
      3. سَكَتَاتُ حَفْصٍ الأَرْبَعُ (س)
    </text>
    <text x="260" y="74" font-family="'Cairo', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fef08a" text-anchor="end">قطع الصوت حركتين بلا تنفس:</text>
    <text x="260" y="96" font-family="'Cairo', Arial, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="end">لحفص من طريق الشاطبية 4 سكتات واجبة</text>
    <text x="260" y="118" font-family="'Cairo', Arial, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="end">السكت يمنع إدغام الحرف الساكن</text>

    <g transform="translate(14, 134)">
      <rect width="252" height="228" rx="10" fill="#082f49" stroke="#0ea5e9" stroke-width="1"/>
      <text x="238" y="24" font-family="'Cairo', Arial, sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="end">المواضع الأربعة الواجبة لحفص:</text>
      
      <text x="238" y="50" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">1. سورة الكهف (آية 1-2):</text>
      <text x="238" y="72" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="end">﴿عِوَجَاۜ قَيِّمًا﴾</text>
      
      <text x="238" y="100" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">2. سورة يس (آية 52):</text>
      <text x="238" y="122" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="end">﴿مِّن مَّرْقَدِنَاۜ هَـٰذَا﴾</text>

      <text x="238" y="150" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">3. سورة القيامة (آية 27):</text>
      <text x="238" y="172" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="end">﴿وَقِيلَ مَنْۜ رَاقٍ﴾ (إظهار النون)</text>

      <text x="238" y="200" font-family="'Amiri Quran', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">4. سورة المطففين (آية 14):</text>
      <text x="238" y="222" font-family="'Amiri Quran', Arial, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="end">﴿كَلَّا بَلْۜ رَانَ﴾ (إظهار اللام)</text>
    </g>
  </g>

  <!-- Bottom Bar: خلاصة وتوجيه الشيخ -->
  <g transform="translate(40, 496)" filter="url(#shadow)">
    <rect width="880" height="104" rx="16" fill="#022c22" stroke="#d97706" stroke-width="2"/>
    <text x="860" y="28" font-family="'Cairo', Arial, sans-serif" font-size="13" font-weight="900" fill="#fde047" text-anchor="end">
      ⭐ تَأْصِيلُ د. أَيْمَن سُوَيْد لِعِلْمِ الْوَقْفِ وَالابْتِدَاءِ:
    </text>
    <text x="860" y="52" font-family="'Cairo', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="end">
      الوقف حلية التلاوة وزينة القارئ، وفهم المعنى التفسيري هو المعيار الأول في تحديد مواضع الوقف التام والكافي والحسن؛
    </text>
    <text x="860" y="74" font-family="'Cairo', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="end">
      والسكتات الأربع لحفص من طريق الشاطبية توقيفية لا مجال للرأي فيها، ومدارها على حبس الصوت دون تنفس بمقدار حركتين.
    </text>
  </g>
</svg>
