      const playMetronomeTick = (isFirst) => {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          const ctx = new AudioContextClass();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = isFirst ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(isFirst ? 880 : 587, ctx.currentTime);
          gain.gain.setValueAtTime(0.14, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } catch (e) {
          // ignore if audio blocked
        }

        });
        return Math.round((correct / islamicData.quizQuestions.length) * 100);
      }, [islamicData, islamicQuizAnswers]);

      // Toast notification
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Load initial pre-loaded demo lessons
      useEffect(() => {
        handleLoadDemoTajweed();
        // // // handleLoadDemoIslamic(); - Clean slate on startup - Clean slate on startup - Clean slate on startup
      }, []);

      // Handlers to load Pre-loaded Demo Lessons instantly
      function handleLoadDemoTajweed() {
        setTajweedData(getFallbackTajweed());
        setQuizAnswers({});
        setQuizSubmitted(false);
        showToast(isRtl ? 'تم تحميل درس التجويد التجريبي الجاهز (سورة الملك) ⚡' : 'Pre-loaded Tajweed Demo Lesson Loaded (Al-Mulk) ⚡');
      }

      // Intelligent Islamic Lecture & Document Parsing Engine
      function handleProcessCustomLecture() {
        if (!rawLectureText || !rawLectureText.trim()) {
          showToast(isRtl ? 'يرجى لصق نص المحاضرة أو رفع ملف أولاً' : 'Please provide lecture text or upload file first');
          return;
        }

        const rawClean = sanitizeArabicExtractedText(rawLectureText).trim();
        const rawLines = rawClean.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        // 1. Detect Lecture Title
        let detectedTopic = (lessonTopic && lessonTopic.trim()) || '';
        if (!detectedTopic) {
          for (let i = 0; i < Math.min(4, rawLines.length); i++) {
            const line = rawLines[i].replace(/^[#*\-•\s\d\.\)\:،]+/, '').trim();
            if (line.length >= 4 && line.length <= 90 && !line.includes('بسم الله')) {
              detectedTopic = line;
              break;
            }
          }
        }
        const topic = detectedTopic || (isRtl ? 'محاضرة شرعية وتأصيل علمي' : 'Islamic Lecture');

        // 2. Detect Subject Category
        let finalCategory = subjectCategory === 'custom' ? (customSubjectCategory.trim() || 'فكر إسلامي ومعاصر') : subjectCategory;
        if (!finalCategory || finalCategory === 'custom') {
          const lowerText = rawClean.toLowerCase();
          if (lowerText.includes('عقيدة') || lowerText.includes('توحيد') || lowerText.includes('إيمان') || lowerText.includes('شرك')) {
            finalCategory = isRtl ? 'عقيدة وتوحيد' : 'Aqeedah & Tawheed';
          } else if (lowerText.includes('فقه') || lowerText.includes('صلاة') || lowerText.includes('طهارة') || lowerText.includes('أحكام')) {
            finalCategory = isRtl ? 'فقه وأصول' : 'Fiqh & Usul';
          } else if (lowerText.includes('تفسير') || lowerText.includes('آيات') || lowerText.includes('سورة')) {
            finalCategory = isRtl ? 'تفسير وعلوم القرآن' : 'Tafseer & Quranic Sciences';
          } else if (lowerText.includes('سيرة') || lowerText.includes('غزوة') || lowerText.includes('صحابة')) {
            finalCategory = isRtl ? 'السيرة النبوية والتاريخ' : 'Seerah & Islamic History';
          } else if (lowerText.includes('خطاب') || lowerText.includes('مدني') || lowerText.includes('فكر') || lowerText.includes('حداثة') || lowerText.includes('علمانية') || lowerText.includes('شبهات') || lowerText.includes('مآلات')) {
            finalCategory = isRtl ? 'فكر إسلامي ومعاصر وقضايا الخطاب' : 'Islamic Thought & Contemporary Discourse';
          } else {
            finalCategory = isRtl ? 'علوم شرعية عامة' : 'Islamic Studies';
          }
        }

        // 3. Extract Quranic Verses and Hadiths / Citations across text
        const detectedAyahs = [];
        const detectedHadiths = [];
        rawLines.forEach(l => {
          if (l.includes('قال تعالى') || l.includes('قوله تعالى') || l.includes('﴿') || (l.includes('سورة') && l.includes(':'))) {
            detectedAyahs.push(l);
          } else if (l.includes('قال رسول الله') || l.includes('قال ﷺ') || l.includes('صحيح مسلم') || l.includes('صحيح البخاري') || l.includes('رواه') || l.includes('حديث')) {
            detectedHadiths.push(l);
          }
        });

        // 4. Intelligent Section Segmentation Engine
        const headingRegex = /^(?:المبحث|المطلب|الفصل|الباب|المحور|المسألة|الوقفة|القسم|الأصل|القاعدة|الضابط|العنصر|النقطة)\s*(?:الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|\d+|[\u0660-\u0669]+|[أ-ي])?[:\.\-\s]|^[#]{1,4}\s+|^(?:أولاً|ثانياً|ثالثاً|رابعاً|خامساً|سادساً|سابعاً|ثامناً|تاسعاً|عاشراً|حادي عشر|ثاني عشر)[:\.\-\s]|^(?:\d+|[\u0660-\u0669]+)[\.\-\)]\s+/i;

        const rawSections = [];
        let currentSec = null;

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i];
          const isHeadingMatch = headingRegex.test(line);
          const isShortHeaderCandidate = line.length < 65 && !line.endsWith('.') && !line.endsWith('،') && !line.endsWith('؛') && (line.startsWith('**') || line.startsWith('•') || /^[^\s]{3,25}:/.test(line));

          if ((isHeadingMatch || isShortHeaderCandidate) && rawSections.length < 10) {
            if (currentSec && currentSec.lines.length > 0) {
              rawSections.push(currentSec);
            }
            const cleanTitle = line.replace(/^[#*\-•\s\d\.\)\:،]+/, '').replace(/[*#]/g, '').trim();
            currentSec = {
              title: cleanTitle.length > 3 ? cleanTitle : ('المحور ' + (rawSections.length + 1)),
              isFormalHeading: isHeadingMatch,
              lines: []
            };
          } else {
            if (!currentSec) {
              currentSec = {
                title: topic.length > 3 ? topic : (isRtl ? 'المحور التمهيدي والتأصيلي' : 'Introduction & Foundation'),
                isFormalHeading: false,
                lines: []
              };
            }
            currentSec.lines.push(line);
          }
        }
        if (currentSec && currentSec.lines.length > 0) {
          rawSections.push(currentSec);
        }

        // Drop preamble metadata (e.g. author name, book title) if it precedes the first formal chapter/section
        if (rawSections.length > 1 && !rawSections[0].isFormalHeading && rawSections[0].lines.length <= 2) {
          rawSections.shift();
        }

        // Fallback Segmentation if document has no formal headings (continuous paragraphs)
        let processedSections = [];
        if (rawSections.length < 2) {
          const totalLines = rawLines.length;
          const chunkSize = Math.max(1, Math.ceil(totalLines / 4));
          for (let c = 0; c < 4; c++) {
            const chunkLines = rawLines.slice(c * chunkSize, (c + 1) * chunkSize);
            if (chunkLines.length > 0) {
              const firstLine = chunkLines[0].replace(/^[#*\-•\s\d\.\)\:،]+/, '').trim();
              const chunkTitle = firstLine.length > 50 ? (firstLine.substring(0, 50) + '...') : firstLine;
              processedSections.push({
                title: (isRtl ? `المحور ${c + 1}: ` : `Theme ${c + 1}: `) + chunkTitle,
                lines: chunkLines
              });
            }
          }
        } else {
          processedSections = rawSections;
        }

        if (processedSections.length > 6) {
          processedSections = processedSections.slice(0, 6);
        }

        // 5. Build Rich Content for each Section (Worksheet Items, Blueprint & Zoom Cards)
        const totalDuration = lessonDuration || 60;
        const minutesPerPhase = Math.round(totalDuration / processedSections.length);

        const blueprintPhases = [];
        const worksheetRows = [];
        const zoomDeck = [];
        const quizList = [];

        processedSections.forEach((sec, idx) => {
          const secNum = idx + 1;
          const secText = sec.lines.join(' ');
          
          // Substantive teacher synthesis extracted directly from the actual text of this section:
          const candidateSentences = sec.lines.filter(l => l.length > 25 && !l.startsWith('#'));
          let modelAnswer = candidateSentences.slice(0, 3).join(' ') || secText.substring(0, 220);
          if (modelAnswer.length > 280) modelAnswer = modelAnswer.substring(0, 280) + '...';

          // Extract or assign authentic scripture/evidence for this section
          let secScripture = '';
          const vMatch = secText.match(/(?:قال تعالى[:\s]*)?﴿[^﴾]+﴾/);
          const hMatch = secText.match(/(?:قال رسول الله|قال النبي|روى البخاري|حديث)[\s\S]*?(?:«[^»]+»|"[^"]+")/);
          if (vMatch) {
            secScripture = vMatch[0];
          } else if (hMatch) {
            secScripture = hMatch[0];
          } else if (detectedAyahs[idx % Math.max(1, detectedAyahs.length)]) {
            secScripture = detectedAyahs[idx % Math.max(1, detectedAyahs.length)];
          } else if (detectedHadiths[idx % Math.max(1, detectedHadiths.length)]) {
            secScripture = detectedHadiths[idx % Math.max(1, detectedHadiths.length)];
          } else {
            secScripture = '﴿فَاسْتَمْسِكْ بِالَّذِي أُوحِيَ إِلَيْكَ ۖ إِنَّكَ عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾ [الزخرف: 43]';
          }

          // Generate a specific, non-generic student question based on the section's actual topic & text
          const studentQ = `في ضوء محور (${sec.title})؛ بيّن القضية الشرعية أو الفكرية التي يقررها النص، وما هو الأثر المترتب عليها في واقع المسلم؟`;

          // Generate an actionable practical & behavioral impact
          const practicalImp = `ترسيخ الوعي المنضبط بـ (${sec.title})، والاعتزاز بمرجعية الوحي وسلطان النص، وتطبيق ذلك في الحوار ودفع الشبهات.`;

          // Key talking points from section
          const secTalkingPoints = candidateSentences.slice(0, 2).length > 0 
            ? candidateSentences.slice(0, 2) 
            : [`تأصيل مسألة: ${sec.title}`, 'استنباط الثمرة المنهجية والتربوية'];

          // A. Blueprint Phase
          blueprintPhases.push({
            phaseNumber: secNum,
            phaseNameAr: sec.title,
            phaseNameEn: `Phase ${secNum}: ${sec.title}`,
            allocatedMinutes: minutesPerPhase,
            teacherGuidanceAr: modelAnswer,
            teacherFocusAr: modelAnswer,
            keyTakeawayAr: practicalImp,
            studentQuestion: studentQ,
            practicalImpact: practicalImp,
            scripture: secScripture,
            talkingPoints: secTalkingPoints
          });

          // B. Worksheet Row (Used directly by handleTransferLectureToWorksheet)
          worksheetRows.push({
            num: secNum,
            topic: sec.title,
            scripture: secScripture,
            studentQuestion: studentQ,
            teacherAnswer: modelAnswer,
            practicalImpact: practicalImp,
            maxScore: 5
          });

          // C. Zoom Presentation Card
          zoomDeck.push({
            slideNumber: secNum,
            phaseTitle: `المحور ${secNum}`,
            slideTitle: sec.title,
            scriptureEvidence: secScripture,
            talkingPoints: secTalkingPoints.join(' • '),
            pedagogicalTip: practicalImp,
            titleAr: sec.title,
            bodyAr: modelAnswer,
            practicalAction: practicalImp
          });

          // D. Authentic Quiz Question derived from this section
          let coreCorrectStatement = candidateSentences[0] || modelAnswer;
          if (coreCorrectStatement.length > 95) coreCorrectStatement = coreCorrectStatement.substring(0, 95) + '...';

          quizList.push({
            id: 'quiz_q_' + secNum + '_' + Date.now(),
            questionAr: `بناءً على مدارسة محور: (${sec.title})؛ ما النتيجة المنهجية أو الضابط الشرعي الأساسي الذي يؤكده الشرح؟`,
            questionEn: `Based on (${sec.title}); what is the primary conclusion established?`,
            options: [
              { id: 'a', textAr: coreCorrectStatement, textEn: 'The authentic conclusion established in the lecture' },
              { id: 'b', textAr: 'الاعتماد على الآراء العقلية المجردة دون ضبط بأصول وقواعد فهم السلف', textEn: 'Relying on abstract opinion without scriptural grounding' },
              { id: 'c', textAr: 'فصل المقاصد والتحسينيات عن الأصول والنصوص القطعية', textEn: 'Separating objectives from textual foundations' },
              { id: 'd', textAr: 'التعامل مع النصوص كقضايا تاريخية لا تلزم الواقع المعاصر', textEn: 'Treating scripture as historically bound' }
            ],
            correctOptionId: 'a',
            reflectionPrompt: `المستفاد من محور (${sec.title}): ${modelAnswer.substring(0, 140)}...`,
            explanationAr: `المستفاد من محور (${sec.title}): ${modelAnswer.substring(0, 140)}...`
          });
        });

        // 6. Evidences list for verification banner
        const allEvidences = [];
        if (detectedAyahs.length > 0) {
          detectedAyahs.slice(0, 2).forEach(ay => {
            allEvidences.push({
              type: 'quran',
              arabicText: ay.replace(/^.*(?:قال تعالى|قوله تعالى)[:\s]*/, ''),
              englishTranslation: 'Authentic Quranic Text Extracted from Lecture',
              citation: 'القرآن الكريم',
              narrator: '—',
              grading: 'متواتر قطعي الثبوت'
            });
          });
        } else {
          allEvidences.push({
            type: 'quran',
            arabicText: 'يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَقُولُوا۟ قَوْلًۭا سَدِيدًۭا',
            englishTranslation: 'O you who have believed, fear Allah and speak words of appropriate justice.',
            citation: 'سورة الأحزاب: 70',
            narrator: '—',
            grading: 'متواتر قطعي الثبوت'
          });
        }

        if (detectedHadiths.length > 0 || structuredHadithText) {
          allEvidences.push({
            type: 'hadith',
            arabicText: structuredHadithText || detectedHadiths[0] || '«إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى»',
            englishTranslation: 'Actions are according to intentions, and every person will have only what they intended.',
            citation: 'صحيح البخاري ومسلم',
            narrator: 'أمير المؤمنين عمر بن الخطاب رضي الله عنه',
            grading: 'صحيح متفق عليه'
          });
        }

        // 7. Rich WhatsApp Summary
        const summaryPoints = processedSections.slice(0, 4).map((s, idx) => {
          const numEmoji = ['1️⃣', '2️⃣', '3️⃣', '4️⃣'][idx] || '🔹';
          const summarySnippet = s.lines.find(l => l.length > 20) || s.title;
          return `${numEmoji} *${s.title}:* ${summarySnippet.substring(0, 80)}`;
        }).join('\n');

        const whatsAppSummary = `🌿 *خلاصة درس اليوم:* ${topic} 🌿\n\nالسلام عليكم ورحمة الله وبركاته يا أحبة 🌸\n\n📌 *الموضوع:* ${topic} (${finalCategory})\n\n✨ *أهم المحاور والفوائد المستفادة:*\n${summaryPoints}\n\n🎯 *الواجب العملي للأسبوع:* مدارسة هذه المحاور وتطبيق مقتضاها السلوكي في حماية الفهم المنضبط ونقله للغير.\n\n🔗 منصة مِشكاة لتعليم القرآن والعلوم الشرعية — حفظكم الله وبارك فيكم! 🤍`;

        // 8. Assemble Full Package Data
        const packageData = {
          metadata: {
            topic: topic,
            category: finalCategory,
            durationMinutes: totalDuration,
            audience: audienceLevel || 'الدارسين والحلقة'
          },
          blueprint: blueprintPhases,
          worksheetItems: worksheetRows,
          evidences: allEvidences,
          hadithVerification: allEvidences,
          zoomCards: zoomDeck,
          zoomPresentation: zoomDeck,
          whatsAppKit: {
            headline: 'خلاصة: ' + topic,
            formattedText: whatsAppSummary,
            actionItem: 'شاركنا تطبيقك العملي لدرس اليوم!'
          },
          quizQuestions: quizList,
          reviewQuiz: quizList
        };

        setIslamicData(packageData);
        setLessonTopic(topic);
        setSubjectCategory(finalCategory);
        showToast(isRtl ? `تم استخلاص وتحليل (${processedSections.length}) محاور وتوليد ورقة العمل والاختبار بنجاح ✨` : 'Lecture analyzed successfully ✨');
      }

      function handleSaveIslamicLecture() {
        if (!islamicData) return;
        try {
          const currentTopic = islamicData?.metadata?.topic || 'محاضرة شرعية';
          const newEntry = {
            id: 'lec_' + Date.now(),
            savedAt: new Date().toLocaleDateString('ar-EG'),
            data: islamicData
          };
          const existing = Array.isArray(savedIslamicLectures) ? savedIslamicLectures : [];
          const updated = [newEntry, ...existing.filter(x => (x?.data?.metadata?.topic || '') !== currentTopic)];
          setSavedIslamicLectures(updated);
          try {
            localStorage.setItem('mishkah_saved_lectures', JSON.stringify(updated));
            localStorage.setItem('mishkah_active_islamic_data', JSON.stringify(islamicData));
          } catch (storageErr) {
            console.warn('LocalStorage save warning:', storageErr);
          }
          setIsCurrentLectureSaved(true);
          showToast(isRtl ? 'تم حفظ المحاضرة في مكتبتك الخاصة بنجاح 💾' : 'Lecture saved to your library 💾');
        } catch (err) {
          console.error('Error saving lecture:', err);
          setIsCurrentLectureSaved(true);
          showToast(isRtl ? 'تم حفظ المحاضرة محلياً 💾' : 'Lecture saved locally 💾');
        }
      }

      function handleDeleteSavedLecture(id) {
        const updated = savedIslamicLectures.filter(x => x.id !== id);
        setSavedIslamicLectures(updated);
        try {
          localStorage.setItem('mishkah_saved_lectures', JSON.stringify(updated));
        } catch (e) {}
        showToast(isRtl ? 'تم حذف المحاضرة من المكتبة' : 'Lecture removed from library');
      }

      function handleLoadSavedLecture(lec) {
        setIslamicData(lec.data);
        setLessonTopic(lec.data.metadata.topic);
        setSubjectCategory(lec.data.metadata.category);
        setIslamicSubView('workbench');
        showToast(isRtl ? 'تم فتح المحاضرة المحفوظة 📖' : 'Loaded saved lecture 📖');
      }

      // Start Fullscreen Presentation for Lecture
      const handleStartLecturePresentation = (slideIndex = 0) => {
        setPresentationTarget('islamic');
        setActiveSlideIndex(slideIndex);
        setIsFullscreenZoom(true);
      };

      // Start Fullscreen Presentation for Tajweed
      const handleStartTajweedPresentation = (slideIndex = 0) => {
        setPresentationTarget('tajweed');
        setActiveSlideIndex(slideIndex);
        setIsFullscreenZoom(true);
      };

      // Keyboard navigation for presentation mode
      useEffect(() => {
        if (!isFullscreenZoom) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsFullscreenZoom(false);
          } else if (e.key === 'ArrowLeft') {
            setActiveSlideIndex(prev => {
              const max = presentationTarget === 'islamic'
                ? (((islamicData && (islamicData.zoomCards || islamicData.blueprint || [])).length || 1) - 1)
                : (((tajweedData && (tajweedData.presentationCards || [])).length || 1) - 1);
              return Math.min(max, prev + 1);
            });
          } else if (e.key === 'ArrowRight') {
            setActiveSlideIndex(prev => Math.max(0, prev - 1));
          } else if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            setActiveSlideIndex(prev => {
              const max = presentationTarget === 'islamic'
                ? (((islamicData && (islamicData.zoomCards || islamicData.blueprint || [])).length || 1) - 1)
                : (((tajweedData && (tajweedData.presentationCards || [])).length || 1) - 1);
              return Math.min(max, prev + 1);
            });
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isFullscreenZoom, presentationTarget, islamicData, tajweedData]);

      // Export Lecture Presentation to Microsoft PowerPoint (.pptx)
      const handleExportIslamicPowerPoint = async () => {
        if (!islamicData) {
          showToast(isRtl ? 'لا توجد محاضرة لتحويلها إلى عرض تقديمي' : 'No lecture to export');
          return;
        }
        if (typeof PptxGenJS === 'undefined') {
          showToast(isRtl ? 'محرك البوربوينت جاري تحميله، يرجى الانتظار ثوانٍ...' : 'PowerPoint engine loading...');
          return;
        }
        setIsExportingPptx(true);
        try {
          const pptx = new PptxGenJS();
          pptx.layout = 'LAYOUT_16x9';
          pptx.rtlMode = isRtl;

          const topic = (islamicData.metadata && islamicData.metadata.topic) || 'المحاضرة الشرعية والتأصيل العلمي';
          const category = (islamicData.metadata && islamicData.metadata.category) || 'العلوم الشرعية';

          // Slide 1: Grand Islamic Title & Cover Slide
          const cover = pptx.addSlide();
          cover.background = { color: '062319' }; // Islamic Emerald

          cover.addShape(pptx.ShapeType.roundRect, {
            x: 0.8, y: 0.8, w: 11.7, h: 5.6,
            fill: { color: '0A3324' }, line: { color: 'C69214', width: 2 }
          });

          cover.addText('مِشكاة | Mishkah', {
            x: 1.2, y: 1.2, w: 10.9, h: 0.6,
            fontSize: 16, fontFace: 'Arial', color: 'F59E0B', bold: true, align: isRtl ? 'right' : 'left'
          });

          cover.addText(topic, {
            x: 1.2, y: 2.2, w: 10.9, h: 1.8,
            fontSize: 32, fontFace: 'Traditional Arabic', color: 'FEF3C7', bold: true, align: isRtl ? 'right' : 'left'
          });

          cover.addText(`المجال: ${category} | المستوى: ${(islamicData.metadata && islamicData.metadata.audience) || 'الدارسين والحلقة'}`, {
            x: 1.2, y: 4.2, w: 10.9, h: 0.6,
            fontSize: 15, fontFace: 'Arial', color: '86EFAC', align: isRtl ? 'right' : 'left'
          });

          cover.addText('إعداد وتقديم: فضيلة المعلم والمحاضر الشرعي\nشركة AnubisLand — منظومة مِشكاة للتعليم الشرعي والقرآني', {
            x: 1.2, y: 5.0, w: 10.9, h: 1.0,
            fontSize: 13, fontFace: 'Arial', color: 'CBD5E1', align: isRtl ? 'right' : 'left'
          });

          // Content Slides: Each extracted theme / section
          const slidesData = (islamicData.zoomCards && islamicData.zoomCards.length > 0)
            ? islamicData.zoomCards

      // Comprehensive Arabic Document Cleaner & Sanitizer
      // Cleans PDF.js and Word font encoding artifacts (repeated Dals used as tatweel/stretch bars, reversed ligatures, TOC dot leaders)
      function sanitizeArabicExtractedText(rawText) {
        if (!rawText) return '';
        let text = rawText;

        // 1. Strip all Tatweel/Kashida characters
        text = text.replace(/[\u0640]+/g, '');

        // 2. Collapse repeated Dals (which Adobe InDesign / Word PDF fonts encode in place of elongation bars)
        text = text.replace(/د{2,}/g, '');
        text = text.replace(/\bلق\b/g, 'لقد');

        // 3. Collapse any Arabic letter repeated 3+ times to 1
        text = text.replace(/([^0-9\s\.\-\*#])\1{2,}/g, '$1');

        // 4. Remove Table of Contents leader dots, underline streaks, and dashes
        text = text.replace(/\.{3,}/g, ' ');
        text = text.replace(/_{3,}/g, ' ');
        text = text.replace(/[\-]{4,}/g, ' ');

        // 5. Correct common Arabic PDF/OCR reversed or broken ligatures
        text = text.replace(/\bامل(?=[أ-ي])/g, 'الم');
        text = text.replace(/\bاحل(?=[أ-ي])/g, 'الح');
        text = text.replace(/\bإبل\b/g, 'إلى');
        text = text.replace(/\bأمهية\b/g, 'أهمية');
        text = text.replace(/\bألوائل\b/g, 'الأوائل');
        text = text.replace(/\bاختاالف\b/g, 'اختلاف');
        text = text.replace(/\bاختا/g, 'اخت');
        text = text.replace(/\bوهللا\b/g, 'والله');
        text = text.replace(/\bكالم\b/g, 'كلام');
        text = text.replace(/\bيف\b/g, 'في');
        text = text.replace(/\bمل\b/g, 'لم');

        // 6. Filter lines to discard Table of Contents remnants
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const cleanLines = [];
        let insideTOC = false;

        for (let i = 0; i < lines.length; i++) {
          const l = lines[i];
          if (/^(?:الفهرس|المحتويات|فهرس الموضوعات|جدول المحتويات)/i.test(l)) {
            insideTOC = true;
            continue;
          }
          if (insideTOC) {
            if (/\.{2,}|_{2,}|\b\d+\s*$/.test(l) && l.length < 90) {
              continue; // skip TOC entry line
            } else if (l.length > 90 || /^(?:المقدمة|تمهيد|مدخل|الباب|الفصل|المبحث|المحور)/i.test(l)) {
              insideTOC = false;
            }
          }
          // Skip pure numbers or isolated dot lines
          if (/^\d+$/.test(l) || /^[\.\-\s]+$/.test(l)) continue;
          cleanLines.push(l);
        }

        return cleanLines.join('\n');
      }

      // Universal Document Extractor for Word (.docx), PDF (.pdf), and Text (.txt, .md)
      async function handleLectureFileUpload(file) {
        if (!file) return;
        setIsExtractingFile(true);
        try {
          let extractedText = '';
          const fname = file.name;
          const ext = fname.substring(fname.lastIndexOf('.')).toLowerCase();

          if (ext === '.docx' || ext === '.doc') {
            const arrayBuffer = await file.arrayBuffer();
            if (window.mammoth) {
              const res = await window.mammoth.extractRawText({ arrayBuffer });
              extractedText = res.value || '';
            } else {
              throw new Error('Mammoth Word parser not loaded');
            }
          } else if (ext === '.pdf') {
            const arrayBuffer = await file.arrayBuffer();
            if (window.pdfjsLib) {
              const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
              const pdf = await loadingTask.promise;
              let pagesText = [];
              for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageStr = content.items.map(item => item.str).join(' ');
                pagesText.push(pageStr);
              }
              extractedText = pagesText.join('\n\n');
            } else {
              throw new Error('PDF.js parser not loaded');
            }
          } else {
            // Text or Markdown
            extractedText = await file.text();
          }

          if (!extractedText || !extractedText.trim()) {
            showToast(isRtl ? 'لم يتم العثور على نصوص مقروءة داخل الملف' : 'No readable text found in file');
            setIsExtractingFile(false);
            return;
          }

          const cleanExtracted = sanitizeArabicExtractedText(extractedText);
          setRawLectureText(cleanExtracted);

          // Infer topic title
          const cleanName = fname.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
          const firstLine = extractedText.split('\n').map(l => l.trim()).find(l => l.length > 5 && l.length < 100);
          const suggestedTopic = firstLine || cleanName;
          setLessonTopic(suggestedTopic);

          const words = extractedText.trim().split(/\s+/).length;
          const sizeKb = Math.round(file.size / 1024);
          setUploadedFileInfo({
            name: fname,
            sizeKb,
            wordCount: words,
            lineCount: extractedText.split('\n').length
          });

          showToast(isRtl ? ('تم استخراج نص الملف بنجاح (' + words + ' كلمة) 📄') : ('Extracted ' + words + ' words successfully 📄'));
        } catch (err) {
          console.error('File extraction error:', err);
          showToast(isRtl ? 'حدث خطأ أثناء قراءة الملف، يرجى التأكد من سلامته' : 'Error reading file');
        } finally {
          setIsExtractingFile(false);
        }
      }

      function handleImportLibrary(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              const merged = [...parsed, ...savedIslamicLectures.filter(x => !parsed.some(p => p.id === x.id))];
              setSavedIslamicLectures(merged);
              localStorage.setItem('mishkah_saved_lectures', JSON.stringify(merged));
              showToast(isRtl ? ('تم استيراد ' + parsed.length + ' محاضرة بنجاح 📥') : ('Imported ' + parsed.length + ' lectures 📥'));
            }
          } catch (err) {
            showToast(isRtl ? 'ملف الاستيراد غير صالح' : 'Invalid file format');
          }
        };
        reader.readAsText(file);
      }

                    </div>

                    <div className="bg-emerald-950/90 rounded-2xl p-6 border-2 border-gold-400/50 max-w-3xl text-right font-amiri text-lg sm:text-xl text-slate-100 leading-relaxed shadow-2xl">
                      <p>{isRtl ? card.explanationAr : card.explanationEn}</p>
                    </div>

                    <div className="flex items-center gap-2 pt-4">
                      <button 
                        disabled={activeSlideIndex === 0}
                        onClick={() => setActiveSlideIndex(prev => prev - 1)}
                        className="bg-emerald-800 disabled:opacity-20 hover:bg-emerald-700 text-gold-200 font-bold px-6 py-2.5 rounded-xl text-sm cursor-pointer"
                      >
                        {isRtl ? 'السابق' : 'Previous'}
                      </button>
                      <span className="text-gold-300 font-bold text-base px-3">
                        {activeSlideIndex + 1} / {cardsList.length}
                      </span>
                      <button 
                        disabled={activeSlideIndex === cardsList.length - 1}
                        onClick={() => setActiveSlideIndex(prev => prev + 1)}
                        className="bg-emerald-800 disabled:opacity-20 hover:bg-emerald-700 text-gold-200 font-bold px-6 py-2.5 rounded-xl text-sm cursor-pointer"
                      >
                        {isRtl ? 'التالي' : 'Next'}
                      </button>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {/* ================= SECURITY PIN GATE MODAL ================= */}
          {isPinModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border-2 border-emerald-900 shadow-2xl text-right">
                <div className="flex items-center gap-2 mb-4">
                  <span className="text-3xl">🔒</span>
                  <div>
                    <h3 className="text-lg font-bold text-emerald-950 font-cairo">
                      {isRtl ? 'بوابة أمان المعلم (Teacher PIN Access)' : 'Teacher Security Gate'}
                    </h3>
                    <p className="text-xs text-slate-500">
                      {isRtl ? 'حماية مفاتيح الذكاء الاصطناعي على الخادم ومنع الاستخدام غير المصرح به' : 'Serverless proxy security gate preventing unauthorized AI calls'}
                    </p>
                  </div>
                </div>

                <div className="my-4">
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    {isRtl ? 'رمز المرور المعتمد (PIN):' : 'Enter Teacher Passcode / PIN:'}
                  </label>
                  <input 
                    type="password" 
                    value={tempPin} 
                    onChange={(e) => setTempPin(e.target.value)}
                    placeholder="MISHKAH2026"
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-center font-mono text-base tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-700"
                  />
                  <p className="text-[11px] text-slate-500 mt-1.5">
                    {isRtl ? 'الرمز الافتراضي المعتمد للنسخة: MISHKAH2026' : 'Default sandbox PIN: MISHKAH2026'}
                  </p>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button 
                    onClick={() => setIsPinModalOpen(false)}
                    className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs"
                  >
                    {isRtl ? 'إلغاء' : 'Cancel'}
                  </button>
                  <button 
                    onClick={() => {
                      setTeacherPin(tempPin);
                      localStorage.setItem('mishkah_pin', tempPin);
                      setIsPinModalOpen(false);
                      showToast(isRtl ? 'تم تحديث وحفظ رمز المعلم بنجاح 🔒' : 'Teacher PIN Saved Successfully 🔒');
                    }}
                    className="bg-emerald-800 hover:bg-emerald-700 text-gold-200 font-bold px-5 py-2 rounded-xl text-xs shadow"
                  >
                    {isRtl ? 'حفظ وتأكيد' : 'Confirm PIN'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* APPLICATION FOOTER */}
          <footer className="bg-emerald-950 text-emerald-200/80 border-t border-emerald-900 py-6 text-center text-xs no-print">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="font-bold text-gold-300 font-amiri text-base">مِشكاة | Mishkah</span>
                <span>—</span>
                <span>{isRtl ? 'منصة الداعية والمعلم الأولى لتعليم القرآن والعلوم الشرعية' : 'Empowering Quran & Islamic Studies Educators'}</span>
              </div>
              <div className="text-[11px] text-emerald-400/80">
                <span>Designed with ADR-0006 Grand Emerald & Soft Gold Motif • Gemini Flash Architecture</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
